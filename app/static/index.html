<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OnlyGo — О!дин запрос</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="logo">Only<b>Go</b> <span>· О!дин запрос</span></div>
  <div class="hdr-right">
    <span id="mode" class="badge">…</span>
    <span class="badge mock" title="Все отели, рейсы и цены — синтетические данные">MOCK-данные</span>
    <button id="newTrip" class="ghost">Новая поездка</button>
  </div>
</header>
<main>
  <section id="chatCol">
    <div id="chat"></div>
    <div id="examples">
      <button class="ex">хочу куда-нибудь к тёплому морю в ноябре, недорого, с ребёнком, без долгих перелётов</button>
      <button class="ex">из Питера в Казань на выходные вдвоём, бюджет до 40 тыс</button>
      <button class="ex">на новогодние в горы покататься на лыжах, нас трое взрослых, без визы</button>
      <button class="ex">романтическая поездка с девушкой, хорошая еда, всё равно куда</button>
    </div>
    <div id="edits">
      <span>Правки:</span>
      <button class="ed">на 2 дня позже</button><button class="ed">бюджет меньше</button>
      <button class="ed">мы поедем с собакой</button><button class="ed">другой отель</button><button class="ed">другое направление</button>
    </div>
    <form id="form"><input id="msg" autocomplete="off" placeholder="Опишите поездку одним сообщением…"><button>➤</button></form>
  </section>
  <section id="side">
    <div class="panel"><h3>Что я понял <small>(× — убрать условие)</small></h3><div id="reqs" class="chips muted">Пока ничего</div></div>
    <div id="plan" class="panel hidden"></div>
    <div class="panel"><h3>Логика агента <small>(вызовы инструментов)</small></h3><div id="trace" class="trace muted">—</div><div id="stats" class="stats"></div></div>
  </section>
</main>
<div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
<script src="/static/app.js"></script>
</body>
</html>
